[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "deep_learning"
version = "0.0.1"
description = "Reposit\u00f3rio voltado para o estudo de deep learning na mat\u00e9ria de Machine Learning"
authors = [
  { name = "Yan Camp\u00ealo das Chagas" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
dependencies = [
    "loguru",
    "mkdocs",
    "pip",
    "pytest",
    "python-dotenv",
    "ruff",
    "tqdm",
    "typer",
]
requires-python = "~=3.12.0"


[tool.ruff]
line-length = 99
src = ["deep_learning"]
include = ["pyproject.toml", "deep_learning/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["deep_learning"]
force-sort-within-sections = true

